apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pradeeptalari14/tp-argocd.git
    targetRevision: HEAD
    path: argocd/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true